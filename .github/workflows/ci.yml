name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    name: Contract tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gltest
        run: pip install gltest
      - name: Run contract tests
        run: python3.12 -m pytest tests/direct/test_benchseal.py -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GENLAYER_CHAIN: studionet
          NEXT_PUBLIC_GENLAYER_ENDPOINT: https://studio.genlayer.com/api
          NEXT_PUBLIC_BENCHSEAL_CONTRACT: "0x3802e88e48471622d7745884982dB30d27592190"
          NEXT_PUBLIC_BENCHSEAL_DATA: live
